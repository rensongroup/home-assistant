---
name: Release Drafter

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write # allow GITHUB_TOKEN to update releases

jobs:
  update_release_draft:
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Extract version from manifest
        id: get_version
        run: |
          # Uses jq to pull the "version" field from your manifest.json
          VERSION=$(jq -r '.version' custom_components/openmotics/manifest.json)
          echo "extracted_version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🚀 Draft Release
        uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0 # v7.6.0
        with:
          config-name: release-drafter.yml # the default, loads '.github/release-drafter.yml'
          # This forces release-drafter to use your file's version
          # instead of calculating its own
          version: ${{ steps.get_version.outputs.extracted_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
